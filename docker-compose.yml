services:
  backend:
    build: ./backend
    ports:
      - "4104:4104"
    environment:
      PORT: 4104
      CORS_ORIGIN: http://127.0.0.1:5174
      DB_FILE: /app/data/app-db.json
    volumes:
      - ./data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "5104:80"
    depends_on:
      - backend

