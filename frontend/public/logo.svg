<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UPI Guardian Mode animated logo">
  <defs>
    <linearGradient id="brand" x1="34" y1="32" x2="222" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#f59e0b;#2563eb" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#22c55e;#f59e0b" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.2 0 0 0 0 0.7 0 0 0 0 1 0 0 0 .45 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bg{fill:#111827}
      .ring{stroke:url(#brand);stroke-width:12;stroke-linecap:round;filter:url(#glow);stroke-dasharray:520;animation:dash 7s ease-in-out infinite}
      .line{stroke:url(#brand);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
      .thin{stroke-width:7}
      .ghost{stroke:#22c55e;stroke-opacity:.42;stroke-width:8}
      .node{fill:#f59e0b;filter:url(#glow);animation:pulse 2.8s ease-in-out infinite}
      .hot{fill:#22c55e;animation:pulse 2.1s ease-in-out infinite}
      @keyframes dash{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:120}}
      @keyframes pulse{0%,100%{opacity:.72;transform:scale(.96);transform-origin:128px 128px}50%{opacity:1;transform:scale(1.08);transform-origin:128px 128px}}
    </style>
  </defs>
  <rect width="256" height="256" rx="54" class="bg"/>
  <path d="M128 30c54 0 98 44 98 98s-44 98-98 98-98-44-98-98 44-98 98-98z" class="ring"/>
  <path d="M128 50l62 36v42c0 42-26 72-62 86-36-14-62-44-62-86V86l62-36z" class="line"/><path d="M98 132c16-30 44-42 60-10 8 16-4 36-30 46-26-10-38-30-30-46z" class="line thin"/><circle cx="128" cy="130" r="13" class="node hot"/>
</svg>
